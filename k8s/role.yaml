apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-role
  namespace: quantam
rules:
- apiGroups: 
    - ""
    - apps
    - autoscaling
    - batch
    - extensions
    - policy
    - rbac.authorization.k8s.io
  resources: 
    - pods
    - pods/exec
    - pods/log
    - deployments
    - deployments/scale
    - replicasets
    - replicasets/scale
    - statefulsets
    - statefulsets/scale
    - cronjobs
    - jobs
    - services
    - configmaps
    - secrets

  verbs: 
    - get
    - list
    - watch
    - create
    - update
    - patch
    - delete